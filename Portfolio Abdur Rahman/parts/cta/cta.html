<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AbdurRahman CTA </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="cta.css">
</head>
<body>

    <section class="cta-section">
        <div class="cta-container">
        
            <div class="cta-header">
            <h2 class="header-small">LETS</h2>
            <h1 class="header-giant">START.</h1>
            <p class="cta-description">
                Currently seeking Internship opportunities<br>
                and open to working on Real-World projects.
            </p>
            </div>

            <div class="cta-actions">
            <a href="mailto:your-email@example.com" class="btn-primary">Get In Touch</a>
            
            <a href="https://github.com/yourprofile" class="btn-outline">
                <img src="github-icon.svg" alt="GitHub" class="social-icon"> 
                Github
            </a>
            
            <a href="https://linkedin.com/in/yourprofile" class="btn-outline">
                <img src="linkedin-icon.svg" alt="LinkedIn" class="social-icon"> 
                Linked In
            </a>
            </div>

        </div>
    </section>
</body>
</html>
