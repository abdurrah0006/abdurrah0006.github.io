<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AbdurRahman Development Tools</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="tools.css">
</head>
<body>

    <section class="tools-section">
        <div class="tools-container">
            
            <div class="tools-header">
                <h2 class="header-small">DEVELOPMENT</h2>
                <h1 class="header-giant">TOOLS<span>.</span></h1>
            </div>
            
            <div class="tools-grid">
            
            <div class="tool-card">
                <img src="html-icon.png" alt="HTML" class="tool-icon">
                <h3 class="tool-name">HTML</h3>
                <div class="progress-container"><div class="progress-bar" style="width: 95%;"></div><span class="progress-text">95%</span></div>
            </div>
            <div class="tool-card">
                <img src="css-icon.png" alt="CSS" class="tool-icon">
                <h3 class="tool-name">CSS</h3>
                <div class="progress-container"><div class="progress-bar" style="width: 90%;"></div><span class="progress-text">90%</span></div>
            </div>
            <div class="tool-card">
                <img src="js-icon.png" alt="JS" class="tool-icon">
                <h3 class="tool-name">JAVASCRIPT</h3>
                <div class="progress-container"><div class="progress-bar" style="width: 85%;"></div><span class="progress-text">85%</span></div>
            </div>
            <div class="tool-card">
                <img src="python-icon.png" alt="Python" class="tool-icon">
                <h3 class="tool-name">PYTHON</h3>
                <div class="progress-container"><div class="progress-bar" style="width: 70%;"></div><span class="progress-text">70%</span></div>
            </div>
            <div class="tool-card">
                <img src="sass-icon.png" alt="Sass" class="tool-icon">
                <h3 class="tool-name">SASS</h3>
                <div class="progress-container"><div class="progress-bar" style="width: 85%;"></div><span class="progress-text">85%</span></div>
            </div>
            <div class="tool-card">
                <img src="ps-icon.png" alt="Photoshop" class="tool-icon">
                <h3 class="tool-name">PHOTOSHOP</h3>
                <div class="progress-container"><div class="progress-bar" style="width: 95%;"></div><span class="progress-text">95%</span></div>
            </div>
            <div class="tool-card">
                <img src="ai-icon.png" alt="Illustrator" class="tool-icon">
                <h3 class="tool-name">ILLUSTRATOR</h3>
                <div class="progress-container"><div class="progress-bar" style="width: 80%;"></div><span class="progress-text">80%</span></div>
            </div>
            <div class="tool-card">
                <img src="nextjs-icon.png" alt="Next.js" class="tool-icon">
                <h3 class="tool-name">NEXT.JS</h3>
                <div class="progress-container"><div class="progress-bar" style="width: 75%;"></div><span class="progress-text">75%</span></div>
            </div>
            <div class="tool-card">
                <img src="sql-icon.png" alt="SQL" class="tool-icon">
                <h3 class="tool-name">SQL</h3>
                <div class="progress-container"><div class="progress-bar" style="width: 80%;"></div><span class="progress-text">80%</span></div>
            </div>
            <div class="tool-card">
                <img src="ts-icon.png" alt="TypeScript" class="tool-icon">
                <h3 class="tool-name">TYPESCRIPT</h3>
                <div class="progress-container"><div class="progress-bar" style="width: 70%;"></div><span class="progress-text">70%</span></div>
            </div>

            </div>
        </div>
</section>

</body>
</html>
