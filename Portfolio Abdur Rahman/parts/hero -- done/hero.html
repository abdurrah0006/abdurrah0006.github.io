<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AbdurRahman Hero Section</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="hero.css">
</head>
<body>

    <main class="hero-container">
    
    <div class="marquee-wrapper">
        <div class="marquee-content">
            <span class="giant-text">ABDUR RAHMAN ABDUR RAHMAN ABDUR RAHMAN </span>
            <span class="giant-text" aria-hidden="true">ABDUR RAHMAN ABDUR RAHMAN ABDUR RAHMAN </span>
        </div>
    </div>

    <div class="portrait-wrapper">
        <img src="profile.png" alt="Abdur Rahman" class="portrait-img">
    </div>

    <div class="hero-headline">
        <p>Intern Web<br>Designer & Developer,</p>
    </div>

    <div class="status-pill">
        <div class="status-indicator">
            <div class="dot-outer"><div class="dot-inner"></div></div>
        </div>
        <div class="status-text">
            <span>Status :</span> <br/>
            Open To Work
        </div>
    </div>

    <div class="hero-actions">
        <a href="#work" class="btn-work">View My Work</a>
        <a href="#contact" class="btn-touch">Get In Touch</a>
    </div>

    <div class="scroll-box">
        <div class="scroll-text">SCROLL</div>

        <div class="line">
            <div class="circle"></div>
            <div class="arrow"></div>
        </div>
    </div>

    </main>

</body>
</html>
